# Flujo de GitHub Actions exclusivamente manual para compilar el APK Debug de TrazoStudio.
#
# Solución al error de `android-actions/setup-android@v3` ("Failed to find package 'tools'"):
# Se reemplaza `setup-android@v3` por la invocación directa de `sdkmanager` (ya disponible en
# /usr/local/lib/android/sdk/cmdline-tools/*/bin/sdkmanager o descargando cmdline-tools si faltase),
# evitando que intente instalar el paquete legado y eliminado `tools`.
#
# Reglas del flujo:
# - Activación 100% manual (`workflow_dispatch`): NO se activa en commits, pull requests ni issues.
# - Sin caché (`cache-disabled: true`, `--no-build-cache`, `--no-daemon`, sin `actions/cache`).
# - Permite elegir entre APK Debug universal (32/64-bit) o solo 64 bits (`arm64-v8a`).
# - Descarga todo el código (`fetch-depth: 0`), instala Android SDK/NDK, Rust,
#   descarga y compila dependencias de Rust, ejecuta `cargo test` y compila el APK Debug en Kotlin.

name: Compilar APK Debug (Manual)

on:
  workflow_dispatch:
    inputs:
      abi_mode:
        description: "Arquitectura del APK Debug (universal = 32/64-bit, arm64-v8a = solo 64-bit)"
        required: true
        default: "universal"
        type: choice
        options:
          - universal
          - arm64-v8a
      verify_apk_contents:
        description: "Inspeccionar librerías .so y classes.dex dentro del APK Debug"
        required: false
        default: true
        type: boolean

jobs:
  build-debug-apk:
    name: Compilar TrazoStudio Debug APK (${{ inputs.abi_mode }})
    runs-on: ubuntu-latest

    steps:
      - name: Descargar todo el código del proyecto
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar utilidades base de compilación del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl unzip clang lld build-essential pkg-config

      - name: Configurar Java 17 (sin caché)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK, Platform 35, Build-Tools 35 y NDK r26d (sin paquete legado 'tools')
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          mkdir -p "$SDK_ROOT"

          SDKMANAGER=""
          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          else
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1 || true)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "Descargando Android cmdline-tools..."
            mkdir -p "$SDK_ROOT/cmdline-tools"
            curl -fsSL -o /tmp/cmdline-tools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools-extract
            mv /tmp/cmdline-tools-extract/cmdline-tools "$SDK_ROOT/cmdline-tools/latest"
            rm -rf /tmp/cmdline-tools.zip /tmp/cmdline-tools-extract
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi

          echo "Usando sdkmanager: $SDKMANAGER"
          { yes || true; } | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;26.3.11579264"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/26.3.11579264" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$SDK_ROOT/ndk/26.3.11579264" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$SDK_ROOT/ndk/26.3.11579264" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

      - name: Instalar Rust 1.100.0 y targets Android (${{ inputs.abi_mode }})
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100.0"
          targets: ${{ inputs.abi_mode == 'arm64-v8a' && 'aarch64-linux-android' || 'armv7-linux-androideabi,aarch64-linux-android,i686-linux-android,x86_64-linux-android' }}

      - name: Instalar cargo-ndk para compilar librerías .so de Android
        run: cargo install cargo-ndk --locked

      - name: Descargar dependencias de Rust y ejecutar pruebas unitarias
        working-directory: android/rust/drawing_engine
        run: |
          cargo fetch
          cargo test

      - name: Configurar Gradle 8.9 (sin caché)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Compilar librerías Rust (${{ inputs.abi_mode }}) y código Kotlin en APK Debug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug -PtrazoAbiMode=${{ inputs.abi_mode }} --no-build-cache --no-daemon --stacktrace

      - name: Verificar contenido del APK Debug generado
        if: ${{ inputs.verify_apk_contents }}
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "Modo elegido: ${{ inputs.abi_mode }}"
          echo "APK generado en: $APK_PATH"
          ls -lh "$APK_PATH"
          unzip -l "$APK_PATH" | grep -E "libtrazo_engine\.so|classes.*\.dex"

      - name: Subir APK Debug como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: TrazoStudio-Debug-APK-${{ inputs.abi_mode }}
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
